<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
    var a=0,b=10;
    while(a<=5){
        document.write( a + ")-   Hello! i AM USING WHILE LOOP <br>");//IT WILL RUN SIX TIMES TILL a<=5.
        a++;
    }
    document.write("<br>");
    while(b>=6){
        document.write( b + ")-   Hello! i AM USING WHILE LOOP with decrement <br>");//IT WILL RUN TEN TIMES TILL b>=6.
        b--;
    }
    </script>
</body>
</html>
