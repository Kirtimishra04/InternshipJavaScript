    <script>
var a=40;
var b=20;

a++;
document.write(a + "<br> <BR>");// This will GIVE  output: 41

//IN a++ the value of a is 40 but after this line the value of a will be 41.

document.write(++a + "<br>"); // This will GIVE  output: 42
//THE INCREMENTED VALUE PF a++ IS 41 THATS WHY ++a IS 42 BECAUSE IN ++a THE VALUE OF a IS FIRST INCREMENTED AND THEN IT IS USED.
// ++a IS 42 BECAUSE IN ++a THE VALUE OF a IS FIRST INCREMENTED AND THEN IT IS USED.

document.write(++b + "<br>"); // This will GIVE  output: 21

//a-- IS 42 BECAUSE IN a-- THE VALUE OF a IS FIRST USED AND THEN IT IS DECREMENTED.
