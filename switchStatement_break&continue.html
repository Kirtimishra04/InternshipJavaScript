//PRINT 1-100, SKIP EVERY NUMBER DIVISIBLE BY 2 OR 3, STOP AT THE FIRST NUMBER DIVISIBLE BY 17. PRINT SKIPPED WHENEVER A NUMBER IS SKIPPED.
for(var i=1;i<=100;i++){
    //stop the loop at first number divisible by 17
    if(i%17===0){
        break;
    }
    //skip number divisible by 2 or 3
    if(i%2===0 || i%3===0){
        document.write("Skipped<br>");
        continue;
    }
    //print the remaining numbers.
    document.write(i +"<br>");
}
