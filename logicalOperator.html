<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script> 
                      //  &&=LOGICAL AND
                     //  ||=LOGICAL OR
                    //   !==LOGICAL NOT
                      var age = 20;
        if(age >= 18 && age <= 65) {
            document.write("You are an adult.<br>");
        } else {
            document.write("You are not an adult.<br>");
        }
        document.write("Age: " + age + "<br>");

        var a=3;
        if(age>a || age<10) {
            document.write(" <b> Age is greater than " + a + " or less than 10<br> </b>");//a IS written outside the if statement because it is a variable and we can use it anywhere in the code.
        }else{
            document.write("Age is not greater than " + a + " and not less than 10<br>");
        }
        if(!(age>10)) {
            document.write(" <b> Age is  greater than 10<br> </b>");
        }else{
            document.write("Age is  NOT greater than 10<br>");
        }
    </script>
</body>
</html>
