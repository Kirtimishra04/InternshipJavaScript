<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //---ceil()-----
var a=Math.ceil(1.2);           var b=Math.ceil(2.5);
document.write( " ceil: "+ a+"<br>");   //gives the nearest upper value.
document.write(b+"<br>");
document.write("<bR>");

 //---floor()-----
var a=Math.floor(1.2);           var b=Math.floor(3.8);
document.write(" floor: " + a+"<br>");   //gives the nearest lower value.
document.write(b+"<br>");
document.write("<bR>");

 //---round()-----
var a=Math.round(1.2);           var b=Math.round(2.5);
document.write( " round : " + a+"<br>");   // it return lower value if property is below .5
document.write(b+"<br>"); // return upper value when value is grater then .5
document.write("<bR>");

 //---trunc()-----
var a=Math.trunc(1.2);           var b=Math.trunc(2.5);
document.write( " trunc: "+ a+"<br>");   //it returns always integer value, neglect the values after the decimal.
document.write(b+"<br>");
document.write("<bR>");

//---max(x,y,z,,,,n)-----
var a=Math.max(1,5,7,3,78);           var b=Math.max(-1,-3,-4);
document.write( "max: "+ a+"<br>");   // me put multiple numbers inside the beackets ().then we obtain the maximum value from all 
document.write(b+"<br>");
document.write("<bR>");

//---min(x,y,z,,,,n)-----
var a=Math.min(1,0,45,23);           var b=Math.min(-1,-3,-5,);
document.write( " min: "+ a+"<br>");   //.me put multiple numbers inside the beackets ().then we obtain the minimum or lowest value from all 
document.write(b+"<br>");
document.write("<bR>");

//---sqrt()----- means squareroot.
var a=Math.sqrt(4);           var b=Math.sqrt(2.5);
document.write( " sqrt: "+ a+"<br>");   //it returns the squareroot of the nuMBER
document.write(b+"<br>");
document.write("<bR>");

//---cbrt()-----
var a=Math.cbrt(8);           var b=Math.cbrt(27);
document.write( " cbrt: "+ a+"<br>");   //IT RETURNS THE CUBEROOT OF THE NUMBER
document.write(b+"<br>");
document.write("<bR>");

//---pow(x,y)-----               x IS base       and y is power.
var a=Math.pow(2,2);           var b=Math.pow(4,3);
document.write( " pow: "+ a+"<br>");   //IT IS USED FOR CALCULATING POWER.
document.write(b+"<br>");
document.write("<bR>");


//---random()-----
var a=Math.random(1,2);           var b=Math.floor(Math.random()*10 +1) ;    //FLOOR IS USED FOR---RETURN THE  NEAREST LOWEST  VALUE.
document.write( " random: "+ a+"<br>");   //it gives random value between the digits.
document.write(b+"<br>");//VALUE CHNGES MULTIPLE TIME AFTER REFRESHING.
document.write("<bR>");


//---abs()-----  .........Meaans-Absolute VALUE
var a=Math.abs(1.2);           var b=Math.abs(2+5);
document.write( " abs: "+ a+"<br>");   //RETURNS ABSOLUTE VALUE.
document.write(b+"<br>");        //ALSO USE FOR MATHEMATICAL OPERATION
document.write("<bR>");


//---PI-----
var a=Math.PI;           var b=Math.PI;
document.write( " PI: "+ a+"<br>");   //IT RETURNS A CONSTANT VALUE.
document.write(b+"<br>");
document.write("<bR>");



    </script>
</body>
</html>
