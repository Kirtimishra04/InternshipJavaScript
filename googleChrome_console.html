 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YES I AM LEARNING JS</title>
 </head>
 <body>
    <script>
        //IN THIS,THE CONSOLE.LOG VALUE GIVES OUTPUT IN THE CONSOLE OF THE BROWSER,
        // WHICH IS USED FOR DEBUGGING PURPOSES.
        //OUTPUT VISIBLE IN INSPECT ELEMENT->CONSOLE TAB OF THE BROWSER.
        var name = "John Doe";
        console.time("Time taken to execute");
        console.log(name);
        console.log("Hello, " + name + "! Welcome to JavaScript.");
    //WE CAN DO OR print any operation
    console.table([1,3,5]);
    //BY USING console.table.(table is the command of console)  IT CREATES A TABLE IN CONSOLE.

    console.error("This is an error message. created by human");
    //BY USING console.error.(error is the command of console)  IT CREATES A ERROR MESSAGE IN CONSOLE.

    console.warn("This is a warning message. created by human");//it creates warning.
    
    console.timeEnd("Time taken to execute");
    //console.clear("This is a clear message. created by human");//it clears the console messages or outputs.

    </script>
 </body>
