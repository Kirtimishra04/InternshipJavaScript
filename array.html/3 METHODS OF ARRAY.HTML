<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   // 1st= toString()---------
   //2nd = valueOf()----------
   //3rd = fill()---------
   <script>
//-----toString()--
//IT CONVERTS ARRAY INTO STRING ADN PRINT.
var a=["Rahul","Manish","Sakshi","Santa"];
a.toString();
document.write(a +"<bR>");

// --valueOf()------
//IT RETURNS THE ARRAY.----SAME AS DOCUMENT.WRITE 
a.valueOf();
document.write(a +"<br>");

//---fill()-----
//IT FILLS ALL THE ELEMENTS IN AN ARRAY WITH A STATIC OR SAME VALUE
//LIKE replacing each element with a single word .
a.fill("Mango");
document.write(a+"<bR>");




   </script>
</body>
</html>
