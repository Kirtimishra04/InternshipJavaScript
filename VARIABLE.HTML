<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
    // in var it declares a same value multiple times.
        var myVariable = "Hello";
        var myDigit = 5;
        myVariable=" Hiii";// VAR CAN REPLACE OR CHANGE THE VALUE OF VARIABLE MULTIPLE TIMES.
        document.write(myVariable + "<br>"); // This will GIVE  output: Hello
       // + SIGN IS USED FOR JOINT OR CONCATENATION OF TWO STRINGS,IT CAN NOT BE REPLACED WITH COMMA(,) OR ANY OTHER SIGN.
       document.write(myDigit + "<br>"); // This will GIVE  output: 5


//a same value does not declared two time using let keyword, it will give error.
       let theVariable = "how are you";
       theVariable= "i am fine";
       document.write(theVariable+ "<br>"); // This will GIVE  output: how are you


const myConstant = "I am constant";
document.write(myConstant+ "<br>"); // This will GIVE  output: I am constant
// in const VA
// CONT CANT BE CHANGED ONCES DECLARED.
    </script>
</body>
</html>
